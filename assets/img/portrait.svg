<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="purple" cx=".35" cy=".18" r=".6">
      <stop offset="0" stop-color="#6d3fd6" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#3b1d7a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b1d7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx=".05" cy=".95" r=".6">
      <stop offset="0" stop-color="#16a34a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1726"/>
      <stop offset=".5" stop-color="#0d0b13"/>
      <stop offset="1" stop-color="#07060b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="600" height="640" fill="#0b0a11"/>
  <rect width="600" height="640" fill="url(#purple)"/>
  <rect width="600" height="640" fill="url(#green)"/>
  <ellipse cx="260" cy="200" rx="170" ry="120" fill="#5b34b8" opacity=".25" filter="url(#haze)"/>
  <!-- head & shoulders, facing left -->
  <g transform="translate(1601.6 -335.6) scale(-1.7 1.7)">
    <path d="M598 520 C 604 452 630 420 680 405 C 700 398 708 390 711 380 C 700 369 690 350 690 330 C 688 295 710 268 745 268 C 780 268 801 292 800 324 C 806 334 811 345 806 352 C 802 360 800 372 792 380 C 788 392 790 400 800 406 C 850 420 882 452 892 520 Z" fill="url(#body)"/>  </g>
  <rect x="85" y="540" width="500" height="100" fill="#07060b"/>
  <!-- rim light on face profile and hair -->
  <g transform="translate(1601.6 -335.6) scale(-1.7 1.7)" fill="none" filter="url(#soft)">
    <path d="M748 254 C 776 254 800 270 804 296 C 802 312 801 318 800 324 C 806 334 811 345 806 352 C 802 360 800 372 792 380" stroke="url(#rim)" stroke-width="1.8" opacity=".75"/>
